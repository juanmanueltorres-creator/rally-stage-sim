name: Probe WRC Data

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - .github/workflows/probe-wrc-data.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch 2026 WRC calendar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          curl --fail-with-body --silent --show-error --location \
            'https://api.wrc.com/content/filters/calendar?language=en&size=30&championship=wrc&origin=vcms&year=2026' \
            -o probe/calendar.json

          echo 'Calendar payload:'
          jq '{count: (.content | length), events: [.content[] | {title, location, eventId, rallyId, startDate}]}' probe/calendar.json

          jq -r '.content[] | select(((.title // "") + " " + (.location // "")) | test("Chile|BioB[ií]o"; "i")) | [.eventId, .rallyId, .title, .location] | @tsv' probe/calendar.json \
            | head -n 1 > probe/chile.tsv

          if [ -s probe/chile.tsv ]; then
            IFS=$'\t' read -r EVENT_ID RALLY_ID TITLE LOCATION < probe/chile.tsv
            printf '%s\n' "Found Chile: eventId=$EVENT_ID rallyId=$RALLY_ID title=$TITLE location=$LOCATION"

            curl --fail-with-body --silent --show-error --location \
              "https://api.wrc.com/content/result/stages?eventId=${EVENT_ID}&rallyId=${RALLY_ID}&championship=wrc" \
              -o probe/stages.json

            curl --fail-with-body --silent --show-error --location \
              "https://api.wrc.com/content/result/itinerary?eventId=${EVENT_ID}&extended=true" \
              -o probe/itinerary.json

            echo 'Stage fields:'
            jq '{fields, sample: (.values // [])[0:5]}' probe/stages.json || true
          else
            echo 'Chile 2026 was not found in the calendar response.'
          fi

      - name: Upload probe payloads
        uses: actions/upload-artifact@v4
        with:
          name: wrc-2026-probe
          path: probe/
          retention-days: 1
