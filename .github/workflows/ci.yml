name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture Rally-Maps stage geometry payload
        shell: bash
        run: |
          set -e
          curl --max-time 15 -L -sS -A "Mozilla/5.0" \
            "https://www.rally-maps.com/rm2/rest/geodata/related/stage/288420/mapobjects" \
            -o /tmp/turquia-mapobjects.json
          echo "mapobjects bytes=$(wc -c </tmp/turquia-mapobjects.json)"
          head -c 240 /tmp/turquia-mapobjects.json || true
          echo

      - name: Upload Turquía geometry payload
        uses: actions/upload-artifact@v4
        with:
          name: turquia-mapobjects
          path: /tmp/turquia-mapobjects.json
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
