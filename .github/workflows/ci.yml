name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe WRC Chile geometry feed
        shell: bash
        run: |
          set +e
          code=$(curl --max-time 10 -L -sS -o /tmp/chile_2026.xml -w "%{http_code}" "https://webapps2.wrc.com/2020/web/live/kml/chile_2026.xml")
          echo "chile_2026.xml HTTP=$code bytes=$(wc -c </tmp/chile_2026.xml 2>/dev/null || echo 0)"
          head -c 240 /tmp/chile_2026.xml 2>/dev/null || true
          echo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
