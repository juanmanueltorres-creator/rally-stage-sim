name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture official ANARE Turquía map
        shell: bash
        run: |
          set -e
          curl --max-time 20 -L -sS \
            "https://anarerally.cl/wp-content/uploads/2026/06/Turquia.pdf" \
            -o /tmp/Turquia.pdf
          echo "ANARE Turquía PDF bytes=$(wc -c </tmp/Turquia.pdf)"
          file /tmp/Turquia.pdf

      - name: Upload official map probe
        uses: actions/upload-artifact@v4
        with:
          name: anare-turquia-map
          path: /tmp/Turquia.pdf
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
