name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe WRC Chile geometry feed
        shell: bash
        run: |
          set +e
          echo "=== direct KML probe ==="
          code=$(curl -L -sS -o /tmp/chile_2026.xml -w "%{http_code}" "https://webapps2.wrc.com/2020/web/live/kml/chile_2026.xml")
          echo "chile_2026.xml HTTP=$code bytes=$(wc -c </tmp/chile_2026.xml 2>/dev/null || echo 0)"
          head -c 180 /tmp/chile_2026.xml 2>/dev/null || true
          echo
          echo "=== metadata probe ==="
          curl -L -sS "https://webappsdata.wrc.com/srv/wrc/json/api/wrcsrv/queryMeta?t=%22Event%22&p=%7B%22n%22%3A%22category%22%2C%22v%22%3A%22WRC%22%7D&maxdepth=1" -o /tmp/events.json
          echo "events bytes=$(wc -c </tmp/events.json 2>/dev/null || echo 0)"
          grep -o 'chile_[0-9][0-9][0-9][0-9]' /tmp/events.json | sort -u | tail -10 || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
