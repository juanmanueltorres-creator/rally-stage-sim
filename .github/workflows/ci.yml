name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture Rally-Maps map bundle
        shell: bash
        run: |
          set -e
          curl --max-time 15 -L -sS -A "Mozilla/5.0" \
            "https://www.rally-maps.com/rm2/js/dist/bundle/scripts-leafletmap-bundle.min.js?v=2.344" \
            -o /tmp/scripts-leafletmap-bundle.min.js
          curl --max-time 15 -L -sS -A "Mozilla/5.0" \
            "https://www.rally-maps.com/rm2/js/dist/bundle/scripts-nomap-bundle.min.js?v=2.344" \
            -o /tmp/scripts-nomap-bundle.min.js
          echo "leaflet bundle bytes=$(wc -c </tmp/scripts-leafletmap-bundle.min.js)"
          grep -oE '/rm2/rest/[A-Za-z0-9_/?=&{}.%:-]+' /tmp/scripts-leafletmap-bundle.min.js | sort -u | head -50 || true

      - name: Upload Rally-Maps bundle probe
        uses: actions/upload-artifact@v4
        with:
          name: rally-maps-bundle-probe
          path: |
            /tmp/scripts-leafletmap-bundle.min.js
            /tmp/scripts-nomap-bundle.min.js
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
