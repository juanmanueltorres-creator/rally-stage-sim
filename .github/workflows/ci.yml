name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture Rally-Maps stage page
        shell: bash
        run: |
          set -e
          curl --max-time 15 -L -sS -A "Mozilla/5.0" \
            "https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026/Turqu%C3%ADa" \
            -o /tmp/rally-maps-turquia.html
          echo "Rally-Maps HTML bytes=$(wc -c </tmp/rally-maps-turquia.html)"
          grep -oE '<script[^>]+src="[^"]+"' /tmp/rally-maps-turquia.html | head -30 || true

      - name: Upload Rally-Maps probe
        uses: actions/upload-artifact@v4
        with:
          name: rally-maps-probe
          path: /tmp/rally-maps-turquia.html
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
