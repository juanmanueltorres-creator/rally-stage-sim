name: WRC geometry probe

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - scripts/probe-wrc-geometry.mjs
      - .github/workflows/wrc-geometry-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - chile_2026
          - paraguay_2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe WRC event geometry feed
        env:
          WRC_KML_TARGET: ${{ matrix.target }}
        run: node scripts/probe-wrc-geometry.mjs

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrc-geometry-${{ matrix.target }}
          path: artifacts/wrc-geometry-probe/${{ matrix.target }}
          if-no-files-found: error
