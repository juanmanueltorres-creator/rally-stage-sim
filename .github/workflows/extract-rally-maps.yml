name: Extract Rally Maps

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - .github/workflows/extract-rally-maps.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser adapter
        run: npm install --no-save puppeteer-core@24
      - name: Trace Rally Maps data bootstrap
        env:
          RALLY_URL: https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$PUPPETEER_EXECUTABLE_PATH"
          node <<'NODE'
          const puppeteer = require('puppeteer-core')

          ;(async () => {
            const network = []
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.PUPPETEER_EXECUTABLE_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            })
            try {
              const page = await browser.newPage()
              page.on('response', (response) => {
                const request = response.request()
                if (['xhr', 'fetch'].includes(request.resourceType())) {
                  network.push({ status: response.status(), type: request.resourceType(), url: response.url() })
                }
              })
              await page.setViewport({ width: 1080, height: 1024 })
              await page.goto(process.env.RALLY_URL, { waitUntil: 'networkidle2', timeout: 60000 })
              await new Promise((resolve) => setTimeout(resolve, 3000))

              const diagnostic = await page.evaluate(async () => {
                const needles = ['storage.addData', '.addData(', 'initializeMap(', 'rmap_initialized', 'rawData', 'getRallyMap']
                const snippets = []
                const scripts = Array.from(document.scripts)

                for (let scriptIndex = 0; scriptIndex < scripts.length; scriptIndex += 1) {
                  const script = scripts[scriptIndex]
                  let text = script.textContent ?? ''
                  let src = script.src || `inline:${scriptIndex}`
                  if (script.src && new URL(script.src, location.href).origin === location.origin) {
                    try { text = await fetch(script.src).then((response) => response.text()) } catch {}
                  }
                  for (const needle of needles) {
                    let index = 0
                    while ((index = text.indexOf(needle, index)) !== -1 && snippets.length < 80) {
                      snippets.push({
                        needle,
                        src,
                        snippet: text.slice(Math.max(0, index - 1000), Math.min(text.length, index + 2200)),
                      })
                      index += needle.length
                    }
                  }
                }

                const data = window.sl?.leaflet?.data
                const describeFunctions = (value) => value && typeof value === 'object'
                  ? Object.fromEntries(Object.entries(value)
                      .filter(([, member]) => typeof member === 'function')
                      .slice(0, 40)
                      .map(([key, member]) => [key, member.toString().slice(0, 3000)]))
                  : {}

                const likelyGlobals = Object.keys(window)
                  .filter((key) => /rally|map|page|setting|leaflet|cookie|consent/i.test(key))
                  .slice(0, 100)

                return {
                  dataKeys: data ? Object.keys(data) : [],
                  dataFunctions: describeFunctions(data),
                  storageKeys: data?.storage ? Object.keys(data.storage) : [],
                  likelyGlobals,
                  localStorage: Object.fromEntries(Object.keys(localStorage).map((key) => [key, localStorage.getItem(key)])),
                  cookies: document.cookie,
                  snippets,
                }
              })

              console.log(JSON.stringify({ ...diagnostic, network }, null, 2))
            } finally {
              await browser.close()
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
