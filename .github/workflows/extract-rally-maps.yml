name: Extract Rally Maps

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - .github/workflows/extract-rally-maps.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser adapter
        run: npm install --no-save puppeteer-core@24
      - name: Activate Friday map and extract stage geometry
        env:
          RALLY_URL: https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$PUPPETEER_EXECUTABLE_PATH"
          node <<'NODE'
          const fs = require('node:fs')
          const puppeteer = require('puppeteer-core')

          ;(async () => {
            const dataResponses = []
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.PUPPETEER_EXECUTABLE_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            })
            try {
              const page = await browser.newPage()
              await page.setViewport({ width: 1080, height: 1024 })
              page.on('response', (response) => {
                const request = response.request()
                if (['xhr', 'fetch'].includes(request.resourceType()) && response.url().includes('rally-maps.com')) {
                  dataResponses.push({ status: response.status(), url: response.url() })
                }
              })

              await page.goto(process.env.RALLY_URL, { waitUntil: 'networkidle2', timeout: 60000 })
              await page.waitForSelector('.clust_d20260911.showInMap', { timeout: 15000 })
              await page.click('.clust_d20260911.showInMap')

              await page.waitForSelector('.leaflet-control-container', { timeout: 30000 })
              await page.waitForFunction(
                () => (window?.sl?.leaflet?.data?.storage?.stages?.length ?? 0) > 0,
                { timeout: 30000 },
              )

              const extracted = await page.evaluate(() => {
                const stages = window.sl.leaflet.data.storage.stages
                return stages
                  .filter((stage) => /Nuevo Rere|Hualqui/i.test(`${stage.name ?? ''} ${stage.fullName ?? ''}`))
                  .map((stage) => ({
                    id: stage.id ?? null,
                    name: stage.name ?? null,
                    fullName: stage.fullName ?? null,
                    distance: stage.distance ?? stage.length ?? null,
                    geometries: (stage.geometries ?? []).map((entry) => ({
                      type: entry.type ?? null,
                      coordinates: entry.geometry?.coordinates ?? null,
                    })),
                  }))
              })

              if (extracted.length < 2) {
                throw new Error(`Expected Nuevo Rere and Hualqui, got ${extracted.map((stage) => stage.name).join(', ')}`)
              }

              fs.mkdirSync('tmp', { recursive: true })
              fs.writeFileSync('tmp/rally-maps-friday.json', JSON.stringify(extracted, null, 2))
              console.log(JSON.stringify({
                stageCount: await page.evaluate(() => window.sl.leaflet.data.storage.stages.length),
                extracted: extracted.map((stage) => ({
                  id: stage.id,
                  name: stage.name,
                  fullName: stage.fullName,
                  distance: stage.distance,
                  geometries: stage.geometries.map((geometry) => ({
                    type: geometry.type,
                    coordinateCount: Array.isArray(geometry.coordinates) ? geometry.coordinates.length : 0,
                  })),
                })),
                dataResponses,
              }, null, 2))
            } finally {
              await browser.close()
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rally-maps-friday
          path: tmp/rally-maps-friday.json
          if-no-files-found: error
