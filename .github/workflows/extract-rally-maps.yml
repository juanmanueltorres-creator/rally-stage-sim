name: Extract Rally Maps

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - .github/workflows/extract-rally-maps.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser adapter
        run: npm install --no-save puppeteer-core@24
      - name: Inspect current map initialization hooks
        env:
          RALLY_URL: https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$PUPPETEER_EXECUTABLE_PATH"
          node <<'NODE'
          const puppeteer = require('puppeteer-core')

          ;(async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.PUPPETEER_EXECUTABLE_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            })
            try {
              const page = await browser.newPage()
              await page.setViewport({ width: 1080, height: 1024 })
              await page.goto(process.env.RALLY_URL, { waitUntil: 'networkidle2', timeout: 60000 })
              await new Promise((resolve) => setTimeout(resolve, 3000))
              const diagnostic = await page.evaluate(() => {
                const storage = window.sl?.leaflet?.data?.storage
                const controls = [...document.querySelectorAll('input,button,a,label')]
                  .map((node) => ({
                    tag: node.tagName,
                    type: node.getAttribute('type'),
                    id: node.id || null,
                    name: node.getAttribute('name'),
                    value: node.getAttribute('value'),
                    className: typeof node.className === 'string' ? node.className : null,
                    text: (node.textContent ?? '').trim().replace(/\s+/g, ' ').slice(0, 160),
                    onclick: node.getAttribute('onclick'),
                    checked: 'checked' in node ? node.checked : null,
                  }))
                  .filter((entry) => /map|stage|show|rere|hualqui|turqu/i.test(`${entry.id} ${entry.name} ${entry.value} ${entry.className} ${entry.text} ${entry.onclick}`))
                  .slice(0, 120)

                const sourceOf = (fn) => {
                  try { return typeof fn === 'function' ? fn.toString().slice(0, 5000) : null } catch { return null }
                }

                return {
                  stageCount: storage?.stages?.length ?? null,
                  rawDataType: typeof storage?.rawData,
                  rawDataKeys: storage?.rawData && typeof storage.rawData === 'object' ? Object.keys(storage.rawData).slice(0, 80) : [],
                  initSource: sourceOf(storage?.init),
                  addDataSource: sourceOf(storage?.addData),
                  getStagesSource: sourceOf(storage?.getStages),
                  initializeMapSource: sourceOf(window.sl?.leaflet?.initializeMap),
                  controls,
                  leafletContainerCount: document.querySelectorAll('.leaflet-control-container').length,
                  mapLikeElements: [...document.querySelectorAll('[id],[class]')]
                    .filter((node) => /map/i.test(`${node.id} ${typeof node.className === 'string' ? node.className : ''}`))
                    .slice(0, 50)
                    .map((node) => ({ tag: node.tagName, id: node.id || null, className: typeof node.className === 'string' ? node.className : null })),
                }
              })
              console.log(JSON.stringify(diagnostic, null, 2))
            } finally {
              await browser.close()
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
