name: Extract Rally Maps

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - .github/workflows/extract-rally-maps.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chile-2026-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser adapter
        run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Extract embedded Friday stage geometry
        env:
          RALLY_URL: https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$PUPPETEER_EXECUTABLE_PATH"
          node <<'NODE'
          const fs = require('node:fs')
          const puppeteer = require('puppeteer-core')

          ;(async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.PUPPETEER_EXECUTABLE_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            })
            try {
              const page = await browser.newPage()
              await page.setViewport({ width: 1080, height: 1024 })
              await page.goto(process.env.RALLY_URL, { waitUntil: 'networkidle2', timeout: 60000 })
              await new Promise((resolve) => setTimeout(resolve, 2000))

              const extracted = await page.evaluate(() => {
                const storage = window.sl?.leaflet?.data?.storage
                if (!storage) throw new Error('Rally Maps storage runtime not available')

                if ((storage.stages?.length ?? 0) === 0) {
                  const dataScript = Array.from(document.scripts).find((script) =>
                    !script.src &&
                    (script.textContent ?? '').includes('//re') &&
                    (script.textContent ?? '').includes('sl.leaflet.data.storage.addData({')
                  )
                  if (!dataScript?.textContent) throw new Error('Embedded rally data script not found')
                  Function(dataScript.textContent)()
                }

                const stages = storage.getStages?.() ?? storage.stages ?? []
                return stages
                  .filter((stage) => /Nuevo Rere|Hualqui/i.test(`${stage.name ?? ''} ${stage.fullName ?? ''}`))
                  .map((stage) => ({
                    id: stage.id ?? null,
                    name: stage.name ?? null,
                    fullName: stage.fullName ?? null,
                    geometries: (stage.geometries ?? []).map((entry) => ({
                      type: entry.type ?? null,
                      geometryType: entry.geometry?.type ?? null,
                      coordinates: entry.geometry?.coordinates ?? null,
                    })),
                  }))
              })

              if (extracted.length < 2) {
                throw new Error(`Expected Nuevo Rere and Hualqui, got ${extracted.map((stage) => stage.name).join(', ')}`)
              }

              fs.mkdirSync('tmp', { recursive: true })
              fs.writeFileSync('tmp/rally-maps-friday.json', JSON.stringify(extracted, null, 2))
            } finally {
              await browser.close()
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
      - name: Validate and update Friday snapshot
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const extracted = JSON.parse(fs.readFileSync('tmp/rally-maps-friday.json', 'utf8'))
          const path = 'public/data/chile-2026/stages-friday.json'
          const stages = JSON.parse(fs.readFileSync(path, 'utf8'))

          function haversineKm(a, b) {
            const toRad = (value) => value * Math.PI / 180
            const [lon1, lat1] = a
            const [lon2, lat2] = b
            const dLat = toRad(lat2 - lat1)
            const dLon = toRad(lon2 - lon1)
            const p1 = toRad(lat1)
            const p2 = toRad(lat2)
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dLon / 2) ** 2
            return 2 * 6371.0088 * Math.asin(Math.min(1, Math.sqrt(h)))
          }

          function lineLengthKm(coordinates) {
            return coordinates.slice(1).reduce((sum, coordinate, index) => sum + haversineKm(coordinates[index], coordinate), 0)
          }

          const config = {
            SS2: {
              sourceName: 'Nuevo Rere',
              expectedKm: 10.76,
              sourceUrl: 'https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026/Nuevo-Rere',
              sourceLabel: 'Rally-Maps — Rally Chile BIOBÍO 2026 / Nuevo Rere interactive route reference',
              note: "Dense current-route reference reconstruction derived from Rally-Maps' 2026 interactive stage geometry and cross-checked against the current WRC route description and ANARE competition map. Rally-Maps is an external reference, not organizer GPS, so geometry remains reconstructed rather than verified. WRC identifies Nuevo Rere as the former Rere run in reverse with a new start. Technical distance follows the current WRC route article (10.76 km), while the separate schedule snapshot preserves its published 10.92 km value."
            },
            SS3: {
              sourceName: 'Hualqui',
              expectedKm: 16.69,
              sourceUrl: 'https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026/Hualqui',
              sourceLabel: 'Rally-Maps — Rally Chile BIOBÍO 2026 / Hualqui interactive route reference',
              note: "Dense current-route reference reconstruction derived from Rally-Maps' 2026 interactive stage geometry and cross-checked against the current WRC route description and ANARE competition map. Rally-Maps is an external reference, not organizer GPS, so geometry remains reconstructed rather than verified. WRC describes Hualqui as a reversed and shortened evolution of Pulpería, beginning where Pulpería previously finished. Technical distance follows the current WRC route article (16.69 km), while the separate schedule snapshot preserves its published 16.79 km value."
            },
          }

          for (const stage of stages) {
            const cfg = config[stage.code]
            if (!cfg) continue
            const sourceStage = extracted.find((candidate) => candidate.name === cfg.sourceName)
            if (!sourceStage) throw new Error(`Missing extracted ${cfg.sourceName}`)
            const route = sourceStage.geometries.find((geometry) => geometry.type === 'SL' && Array.isArray(geometry.coordinates))
            if (!route || route.coordinates.length < 50) throw new Error(`${stage.code} dense route geometry missing`)

            const lengthKm = lineLengthKm(route.coordinates)
            if (Math.abs(lengthKm - cfg.expectedKm) > 0.15) {
              throw new Error(`${stage.code} extracted length ${lengthKm.toFixed(3)} km is inconsistent with ${cfg.expectedKm.toFixed(2)} km`)
            }

            stage.geometry = { type: 'LineString', coordinates: route.coordinates }
            stage.geometryStatus = 'reconstructed'
            stage.provenance.sources = stage.provenance.sources.filter((source) => !source.url.includes('rally-maps.com'))
            stage.provenance.sources.push({
              label: cfg.sourceLabel,
              url: cfg.sourceUrl,
              accessedAt: '2026-08-29',
            })
            stage.provenance.note = cfg.note
            console.log(`${stage.code}: ${route.coordinates.length} coordinates · ${lengthKm.toFixed(3)} km`)
          }

          fs.writeFileSync(path, `${JSON.stringify(stages, null, 2)}\n`)
          NODE
      - name: Commit refined geometry and remove temporary extractor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/extract-rally-maps.yml
          git add public/data/chile-2026/stages-friday.json
          git commit -m "feat: refine Friday stage geometries"
          git push origin HEAD:feat/chile-2026-foundation
