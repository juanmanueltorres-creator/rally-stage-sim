name: Extract Rally Maps

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - .github/workflows/extract-rally-maps.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser adapter
        run: npm install --no-save puppeteer-core@24
      - name: Test consent-gated map initialization
        env:
          RALLY_URL: https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$PUPPETEER_EXECUTABLE_PATH"
          node <<'NODE'
          const puppeteer = require('puppeteer-core')

          ;(async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.PUPPETEER_EXECUTABLE_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            })
            try {
              const page = await browser.newPage()
              await page.setViewport({ width: 1080, height: 1024 })
              await page.goto(process.env.RALLY_URL, { waitUntil: 'domcontentloaded', timeout: 60000 })

              try {
                await page.waitForSelector('.fc-cta-consent', { timeout: 5000 })
                await page.click('.fc-cta-consent')
              } catch {}

              await page.waitForSelector('.cm__body', { timeout: 15000 })
              const accepted = await page.evaluate(() => {
                const buttons = [...document.querySelectorAll('.cm__btn')]
                const button = buttons.find((node) => /accept all/i.test(node.textContent ?? ''))
                if (!button) return false
                button.click()
                return true
              })
              if (!accepted) throw new Error('Accept All consent button not found')

              await page.waitForSelector('.leaflet-control-container', { timeout: 30000 })
              await page.waitForNetworkIdle({ idleTime: 1000, timeout: 30000 })
              await page.waitForFunction(() => (window?.sl?.leaflet?.data?.storage?.stages?.length ?? 0) > 0, { timeout: 30000 })

              const summary = await page.evaluate(() => ({
                stageCount: window.sl.leaflet.data.storage.stages.length,
                stages: window.sl.leaflet.data.storage.stages.map((stage) => ({ name: stage.name, fullName: stage.fullName })),
              }))
              console.log(JSON.stringify(summary, null, 2))
            } finally {
              await browser.close()
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
