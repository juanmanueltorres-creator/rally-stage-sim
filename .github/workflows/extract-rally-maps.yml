name: Extract Rally Maps

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - .github/workflows/extract-rally-maps.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser adapter
        run: npm install --no-save puppeteer-core@24
      - name: Inspect show-in-map handler
        env:
          RALLY_URL: https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$PUPPETEER_EXECUTABLE_PATH"
          node <<'NODE'
          const puppeteer = require('puppeteer-core')

          ;(async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.PUPPETEER_EXECUTABLE_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            })
            try {
              const page = await browser.newPage()
              await page.setViewport({ width: 1080, height: 1024 })
              await page.goto(process.env.RALLY_URL, { waitUntil: 'networkidle2', timeout: 60000 })
              await page.waitForSelector('.clust_d20260911.showInMap', { timeout: 15000 })

              const diagnostic = await page.evaluate(async () => {
                const target = document.querySelector('.clust_d20260911.showInMap')
                const eventSummary = (node) => {
                  if (!node || !window.jQuery?._data) return null
                  const events = window.jQuery._data(node, 'events') || {}
                  return Object.fromEntries(Object.entries(events).map(([type, handlers]) => [
                    type,
                    handlers.map((handler) => ({
                      selector: handler.selector ?? null,
                      namespace: handler.namespace ?? null,
                      source: typeof handler.handler === 'function' ? handler.handler.toString().slice(0, 2500) : null,
                    })),
                  ]))
                }

                const ownScripts = Array.from(document.scripts)
                  .map((script) => script.src)
                  .filter((src) => src && new URL(src, location.href).origin === location.origin)

                const snippets = []
                for (const src of ownScripts) {
                  try {
                    const text = await fetch(src).then((response) => response.text())
                    let index = 0
                    while ((index = text.indexOf('showInMap', index)) !== -1 && snippets.length < 30) {
                      snippets.push({
                        src,
                        snippet: text.slice(Math.max(0, index - 900), Math.min(text.length, index + 1800)),
                      })
                      index += 9
                    }
                  } catch {}
                }

                const ancestorChain = []
                let node = target
                for (let depth = 0; node && depth < 6; depth += 1, node = node.parentElement) {
                  ancestorChain.push({
                    tag: node.tagName,
                    id: node.id || null,
                    className: typeof node.className === 'string' ? node.className : null,
                    outerHTML: node.outerHTML.slice(0, 5000),
                    events: eventSummary(node),
                  })
                }

                return {
                  ancestorChain,
                  documentEvents: eventSummary(document),
                  bodyEvents: eventSummary(document.body),
                  snippets,
                }
              })

              console.log(JSON.stringify(diagnostic, null, 2))
            } finally {
              await browser.close()
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
