name: Extract Rally Maps

on:
  push:
    branches:
      - feat/chile-2026-foundation
    paths:
      - .github/workflows/extract-rally-maps.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser adapter
        run: npm install --no-save puppeteer-core@24
      - name: Inspect stage storage shape
        env:
          RALLY_URL: https://www.rally-maps.com/Rally-Chile-BIOB%C3%8DO-2026
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$PUPPETEER_EXECUTABLE_PATH"
          node <<'NODE'
          const puppeteer = require('puppeteer-core')

          ;(async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.PUPPETEER_EXECUTABLE_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            })
            try {
              const page = await browser.newPage()
              await page.goto(process.env.RALLY_URL, { waitUntil: 'networkidle2', timeout: 60000 })
              await new Promise((resolve) => setTimeout(resolve, 3000))
              const shape = await page.evaluate(() => {
                const storage = window.sl?.leaflet?.data?.storage
                const stages = storage?.stages
                let getterResult = null
                try { getterResult = storage?.getStages?.() ?? null } catch (error) { getterResult = { error: String(error) } }
                const summarize = (value) => ({
                  type: typeof value,
                  isArray: Array.isArray(value),
                  constructor: value?.constructor?.name ?? null,
                  length: typeof value?.length === 'number' ? value.length : null,
                  keys: value && (typeof value === 'object' || typeof value === 'function') ? Object.keys(value).slice(0, 30) : [],
                  sample: value && (typeof value === 'object' || typeof value === 'function')
                    ? Object.values(value).slice(0, 3).map((entry) => ({
                        name: entry?.name ?? null,
                        fullName: entry?.fullName ?? null,
                        keys: entry && typeof entry === 'object' ? Object.keys(entry).slice(0, 20) : [],
                      }))
                    : [],
                })
                return {
                  stages: summarize(stages),
                  getterResult: summarize(getterResult),
                }
              })
              console.log(JSON.stringify(shape, null, 2))
            } finally {
              await browser.close()
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
